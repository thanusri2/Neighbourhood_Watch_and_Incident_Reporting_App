services:
  - type: web
    runtime: static
    name: neighbourhood-watch-and-incident
    buildCommand: cd Neighbourhood_Watch_and_Incident_Reporting_App/frontend && npm install && npm run build
    staticPublishPath: Neighbourhood_Watch_and_Incident_Reporting_App/frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html